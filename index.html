<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ofrenda para Linux</title>
    <meta name="description" content="Una ofrenda digital de Día de Muertos publicada con AWS Amplify Hosting." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2c4 6 8 10 8 17a8 8 0 0 1-16 0c0-7 4-11 8-17z' fill='%23FF9F1C'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Work+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Papel picado: decoración, no necesitas cambiarlo -->
    <svg width="0" height="0" class="sr-only" aria-hidden="true">
      <symbol id="bandera" viewBox="0 0 100 120">
        <path fill-rule="evenodd" d="M0 0H100V108L92 120 83 108 75 120 67 108 58 120 50 108 42 120 33 108 25 120 17 108 8 120 0 108Z
          M12 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M29 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M47 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z
          M65 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M82 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z
          M42 52a8 8 0 1 0 16 0a8 8 0 1 0-16 0z
          M61 52a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M25 52a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M52 67.6a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M34 67.6a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M52 36.4a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M34 36.4a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M18 82L25 90 18 98 11 90Z M82 82L89 90 82 98 75 90Z M50 86L54 92 50 98 46 92Z" />
      </symbol>
    </svg>
    <div class="papel-picado" aria-hidden="true">
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
    </div>

    <main id="ofrenda" class="ofrenda">
      <!--
        TODO 1: ¿Para quién es tu ofrenda? Escribe su nombre, un apodo o el tema de tu ofrenda.
        Ejemplo: <h1 class="titulo">Para mi abuela Lupita</h1>
      -->
      <h1 class="titulo">Para Linux, mi gatito</h1>

      <div class="altar">
        <div class="dedicatoria" id="dedicatoria">
          <p class="pista">Enciende la vela para leer la dedicatoria.</p>
          <!--
            TODO 2: Escribe unas palabras para quien recuerdas: una persona, una mascota
            o un personaje. Tu página va a ser pública,
            así que comparte solo lo que quieras que cualquiera pueda leer.
            Ejemplo: Por sus tamales de los domingos y por enseñarme a bailar cumbia en la cocina.
          -->
          <p class="texto-dedicatoria">
            Por ser el más noble, gentil, juguetón y cariñoso gatito.
          </p>
        </div>

        <div class="centro">
          <!--
            TODO 3: Pon una foto de quien recuerdas.
            Arrastra tu foto (JPG o PNG) a la lista de archivos del editor.
            Luego cambia "foto-ejemplo.svg" por el nombre de tu foto y describe en alt qué se ve.
            Tu página va a ser pública, así que usa una foto que quieras compartir.
            Ejemplo: <img class="retrato" src="abuela-lupita.jpg" alt="Mi abuela Lupita en su cocina" />
          -->
          <img class="retrato" src="linux.jpg" alt="Linux, un gatito gris de ojos dorados, caminando hacia la cámara sobre el pasto" />
          <div class="vela" aria-hidden="true">
            <span class="llama"></span>
            <span class="cera"></span>
          </div>
          <!-- Linux aparece con la vela encendida, chupándose la patita como bebé: su gesto de siempre -->
          <svg class="gatito" viewBox="0 0 120 130" role="img" aria-label="Linux chupándose la patita como bebé">
            <path class="gatito-cola" d="M92 118 C116 116 118 92 104 84" />
            <ellipse class="gatito-pelo" cx="60" cy="102" rx="34" ry="26" />
            <ellipse class="gatito-calcetin" cx="74" cy="124" rx="9" ry="5" />
            <g class="gatito-cabeza">
              <path class="gatito-pelo" d="M33 40 L30 12 L52 29 Z M87 40 L90 12 L68 29 Z" />
              <path class="gatito-oreja" d="M36 34 L35 19 L47 29 Z M84 34 L85 19 L73 29 Z" />
              <ellipse class="gatito-pelo" cx="60" cy="50" rx="31" ry="26" />
              <path class="gatito-ojo" d="M42 48 q6 5 12 0 M66 48 q6 5 12 0" />
              <path class="gatito-nariz" d="M57 57 h6 l-3 4 Z" />
              <path class="gatito-bigote" d="M28 58 h14 M29 64 l13 -3 M92 58 h-14 M91 64 l-13 -3" />
            </g>
            <ellipse class="gatito-lengua" cx="56" cy="67" rx="3" ry="2.2" />
            <g class="gatito-pata">
              <path class="gatito-brazo" d="M40 104 C38 90 46 76 54 68 L63 72 C58 84 54 96 52 106 Z" />
              <ellipse class="gatito-calcetin gatito-palma" cx="58" cy="69" rx="8" ry="6.5" />
              <path class="gatito-dedos" d="M54 64 v3 M58 63 v3 M62 64 v3" />
            </g>
          </svg>
        </div>

        <div class="nivel nivel-1" aria-hidden="true">
          <span class="flor flor-a"></span>
          <span class="flor flor-b"></span>
          <span class="flor flor-c"></span>
          <span class="flor flor-d"></span>
        </div>
        <div class="nivel nivel-2" aria-hidden="true">
          <span class="veladora"></span>
          <span class="veladora"></span>
          <span class="veladora"></span>
          <span class="veladora"></span>
        </div>
        <div class="nivel nivel-3" aria-hidden="true">
          <span class="flor flor-e"></span>
          <span class="flor flor-f"></span>
          <span class="flor flor-g"></span>
          <span class="flor flor-h"></span>
        </div>
      </div>

      <button id="boton-vela" class="boton" type="button" aria-pressed="false" aria-controls="dedicatoria">
        Encender la vela
      </button>
    </main>

    <footer class="pie">
      Publicada con AWS Amplify Hosting para JSConf México 2026
    </footer>

    <script src="script.js"></script>
  </body>
</html>
